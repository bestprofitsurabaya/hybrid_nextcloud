# Redirect HTTP to HTTPS - HANYA UNTUK ROOT DAN HALAMAN UTAMA
server {
    listen 80;
    server_name nasbpfsby.duckdns.org 192.168.2.26 172.60.199.23;

    # Let's Encrypt ACME challenge - HARUS di port 80
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    # Redirect root dan halaman utama ke HTTPS
    location / {
        # JANGAN redirect endpoint Talk dan Collabora
        if ($request_uri !~ ^/(talk|hosting|cool|browser|loleaflet|standalone-signaling)) {
            return 301 https://nasbpfsby.duckdns.org$request_uri;
        }
        
        # Untuk endpoint Talk/Collabora, proxy langsung tanpa redirect
        proxy_pass http://nextcloud_nginx$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS Server
server {
    listen 443 ssl;
    http2 on;
    server_name nasbpfsby.duckdns.org 192.168.2.26 172.60.199.23;

    # SSL Certificate
    ssl_certificate /etc/letsencrypt/live/nasbpfsby.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nasbpfsby.duckdns.org/privkey.pem;
    
    # Fallback ke self-signed
    #ssl_certificate /etc/ssl/private/selfsigned.crt;
    #ssl_certificate_key /etc/ssl/private/selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # === COLLABORA ONLINE (Nextcloud Office) ===
    
    # Static files
    location ^~ /browser {
        proxy_pass http://nextcloud_collabora:9980;
        proxy_set_header Host $host;
    }

    # WOPI discovery & capabilities
    location ^~ /hosting/discovery {
        proxy_pass http://nextcloud_collabora:9980;
        proxy_set_header Host $host;
    }

    location ^~ /hosting/capabilities {
        proxy_pass http://nextcloud_collabora:9980;
        proxy_set_header Host $host;
    }

    # Main websocket (Krusial untuk live editing)
    location ~ ^/cool/(.*)/ws$ {
        proxy_pass http://nextcloud_collabora:9980;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 36000s;
    }

    # Admin Console websocket
    location ^~ /cool/adminws {
        proxy_pass http://nextcloud_collabora:9980;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 36000s;
    }

    # Download, presentation and image upload (Regular HTTP requests)
    location ~ ^/(c|l)ool {
        proxy_pass http://nextcloud_collabora:9980;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === TALK HIGH-PERFORMANCE BACKEND ===
    # API endpoints
    location ^~ /talk/api/ {
        proxy_pass http://nextcloud_talk_hpb:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # WebSocket for signaling - KRITIS untuk Talk
    location ^~ /talk/ws {
        proxy_pass http://nextcloud_talk_hpb:8081/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings untuk WebSocket
        proxy_connect_timeout 1d;
        proxy_send_timeout 1d;
        proxy_read_timeout 1d;
    }
    
    # Welcome endpoint untuk testing
    location ^~ /talk/welcome {
        proxy_pass http://nextcloud_talk_hpb:8081/api/v1/welcome;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Standalone signaling untuk high-performance backend
    location ^~ /standalone-signaling/ {
        proxy_pass http://nextcloud_talk_hpb:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        
        # Timeout settings krusial untuk menjaga WebSocket tetap hidup
        proxy_connect_timeout 1d;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
    

    # === WELL-KNOWN ===
    location /.well-known/carddav {
        return 301 $scheme://$host/remote.php/dav;
    }
    
    location /.well-known/caldav {
        return 301 $scheme://$host/remote.php/dav;
    }
    
    # === NEXTCLOUD MAIN ===
    location / {
        proxy_pass http://nextcloud_app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 0G;
        client_body_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
